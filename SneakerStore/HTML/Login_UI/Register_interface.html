<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký tài khoản</title>
  <link rel="stylesheet" href="../CSS/style_register.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <div class="wrap">
    <div class="card">
      <h2>Tạo tài khoản</h2>
      <p class="subtitle">Tham gia cộng đồng mua sắm của chúng tôi</p>

      <div class="field">
        <label>Họ và tên</label>
        <input type="text" placeholder="Lê Anh Dũng" />
      </div>

      <div class="field">
        <label>Địa chỉ email</label>
        <input type="email" placeholder="ten@email.com" />
      </div>

      <div class="row">
        <div class="field">
          <label>Số điện thoại</label>
          <input type="tel" placeholder="0912 345 678" />
        </div>

        <div class="field">
          <label>Ngày sinh</label>
          <input type="date" />
        </div>
      </div>

      <a href="Login_interface.html"><button class="btn-submit">Đăng ký</button></a>

      <div class="divider">
        <span>hoặc đăng ký với</span>
      </div>

      <div class="social-icons">
        <a href="#" class="social-icon google" title="Google"><i class="fa-brands fa-google"></i></a>
        <a href="#" class="social-icon facebook" title="Facebook"><i class="fa-brands fa-square-facebook"></i></a>
        <a href="#" class="social-icon apple" title="Apple"><i class="fa-brands fa-apple"></i></a>
        <a href="#" class="social-icon instagram" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
      </div>

      <p class="footer-note">Đã có tài khoản? <a href="../HTML/login_interface.html">Đăng nhập ngay</a></p>
      <p class="policy">Bằng cách đăng ký, bạn đồng ý với <a href="Terms_of_Service.html">Điều khoản dịch vụ</a> và <a href="Privacy_policy.html">Chính sách bảo mật</a> của chúng tôi.</p>
    </div>
  </div>

</body>
</html>
