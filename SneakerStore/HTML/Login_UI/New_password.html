<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt lại mật khẩu - sneakerstore</title>
  <link rel="stylesheet" href="../CSS/style_new_password.css"> 
</head>
<body>

  <div class="wrap">
    <div class="card">
      <h2>Mật khẩu mới</h2>
      <p class="subtitle" style="margin-bottom: 25px;">
        Vui lòng tạo mật khẩu mới cho tài khoản của bạn. Mật khẩu nên có ít nhất 8 ký tự.
      </p>

      <div class="field">
        <label>Mật khẩu mới</label>
        <input type="password" placeholder="Nhập mật khẩu mới...">
      </div>

      <div class="field" style="margin-top: 20px;">
        <label>Nhập lại mật khẩu mới</label>
        <input type="password" placeholder="Nhập lại mật khẩu mới...">
      </div>

      <button class="btn-submit" style="margin-top: 25px;">Xác nhận đổi mật khẩu</button>

      <div class="divider" style="margin: 25px 0 15px 0;"></div>

      <p class="footer-note">
        <a href="Login_interface.html">← Quay lại đăng nhập</a>
      </p>
    </div>
  </div>

</body>
</html>
