<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - sneakerstore</title>
  <link rel="stylesheet" href="../../CSS/style_login/style_login.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <div class="wrap">
    <div class="card">
      <h2>Đăng nhập</h2>

      <div class="field">
        <label>Địa chỉ email</label>
        <input type="email" id="login-email" placeholder="ten@email.com" />
      </div>

      <div class="field">
        <label>Mật khẩu</label>
        <input type="password" id="login-password" placeholder="••••••••" />
      </div>

      <div class="forgot-password">
        <a href="Forget_password.html">Quên mật khẩu?</a>
      </div>

      <button class="btn-submit" id="btn-login">Đăng nhập</button>

      <div class="divider">
        <span>hoặc đăng nhập với</span>
      </div>

      <div class="social-icons">
        <a href="#" class="social-icon google" title="Google"><i class="fa-brands fa-google"></i></a>
        <a href="#" class="social-icon facebook" title="Facebook"><i class="fa-brands fa-square-facebook"></i></a>
        <a href="#" class="social-icon apple" title="Apple"><i class="fa-brands fa-apple"></i></a>
        <a href="#" class="social-icon instagram" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
      </div>

      <p class="footer-note">Chưa có tài khoản? <a href="Register_interface.html">Đăng ký ngay</a></p>
    </div>
  </div>

  <script src="../../JS/Login_script/Login_script.js"></script>
</body>
</html>
