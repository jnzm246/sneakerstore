<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên mật khẩu - sneakerstore</title>
  <link rel="stylesheet" href="../../CSS/style_login/style_forget_password.css"> 
</head>
<body>

  <div class="wrap">
    <div class="card">
      <h2>Khôi phục mật khẩu</h2>
      <p class="subtitle" style="margin-bottom: 25px;">
        Nhập email đã đăng ký để nhận mã xác nhận gồm 6 chữ số.
      </p>

      <div class="field">
        <label>Địa chỉ email</label>
        <div class="input-group">
          <input type="email" placeholder="Nhập email của bạn..." />
          <button class="btn-secondary">Gửi mã</button>
        </div>
      </div>

      <div class="field" style="margin-top: 20px;">
        <label>Mã xác nhận</label>
        <input type="text" placeholder="Nhập mã 6 chữ số..." maxlength="6" />
      </div>

      <a href="New_password.html"><button class="btn-submit" style="margin-top: 15px;">Xác nhận mã</button></a>

      <div class="divider" style="margin: 25px 0 15px 0;"></div>

      <p class="footer-note">
        Nhớ ra mật khẩu rồi? <a href="Login_interface.html  ">Quay lại đăng nhập</a>
      </p>
    </div>
  </div>

</body>
</html>
